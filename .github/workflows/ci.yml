name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[all]"

      - name: Lint with ruff (info only, non-blocking)
        run: ruff check soul/ tests/ || true
        continue-on-error: true

      - name: Type check with mypy (info only, non-blocking)
        run: mypy soul/ --ignore-missing-imports || true
        continue-on-error: true

      - name: Test with pytest (blocking)
        run: pytest tests/ -v --cov=soul --cov-report=term-missing --ignore=tests/test_error_kb.py
