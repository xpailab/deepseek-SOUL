[project]
name = "deepseek-soul"
version = "0.1.0"
description = "DeepSoul — 下一代 AI Agent 框架，融合 OpenClaw 的编排能力与 Hermes 的自我进化"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "DeepSoul Team" }
]
readme = "README.md"

dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "rich>=13.0",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "aiosqlite>=0.20",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "watchfiles>=0.22",
    "python-dotenv>=1.0",
    "croniter>=2.0",
    "psutil>=5.9",
    "tiktoken>=0.7",
    "pydantic-settings>=2.0",
    "async-lru>=2.0",
    "orjson>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.5",
    "mypy>=1.8",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12.0",
]
all = [
    "deepseek-soul[dev,web]",
]

[project.scripts]
soul = "soul.cli:main"
soul-gateway = "soul.gateway.server:main"
soul-mlops = "soul.mlops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
